name: Skill Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skill-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agnix:
    name: agnix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: agent-sh/agnix@d2214a4de441b7c7db8b842035319477b3b6a0b2 # v0.58.0
        with:
          path: skills
          config: .agnix.toml

  skill-check:
    name: skill-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run the CLI directly: the thedaviddias/skill-check action is pinned to the
      # deprecated node20 runtime and has no newer release. The action defaulted
      # security-scan to false; the CLI defaults it on, and its scanner (Snyk
      # Agent Scan) exits non-zero without a SNYK_TOKEN, so the scan stays off
      # until a token is added as a repo secret.
      - run: npx --yes skill-check@1.2.0 skills --no-security-scan
