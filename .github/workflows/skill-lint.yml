name: Skill Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skill-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agnix:
    name: agnix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: agent-sh/agnix@19997c99b11b74d42346615334d2150bee7e40d0 # v0.57.0
        with:
          path: skills
          config: .agnix.toml

  skill-check:
    name: skill-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run the CLI directly: the thedaviddias/skill-check action is pinned to the
      # deprecated node20 runtime and has no newer release. The action defaulted
      # security-scan to false; the CLI defaults it on, so turn it off to match.
      - run: npx --yes skill-check@1.2.0 skills --no-security-scan
